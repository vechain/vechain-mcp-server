name: Publish Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify version matches tag
        run: |
          TAG='${{ github.ref_name }}'
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [[ "$TAG" != "$PKG_VERSION" ]]; then
            echo "::error::Tag ($TAG) does not match package.json version ($PKG_VERSION)"
            exit 1
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-output
          path: |
            dist/
            package.json
            package-lock.json
            README.md
            LICENSE

  publish-to-npmjs:
    needs: [build]
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-output

      - name: Setup Node.js for npmjs.org
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Upgrade npm
        run: npm install -g npm@11.5.1

      - name: Publish to npmjs.org
        run: npm publish --access public --tag latest --provenance
        env:
          NPM_CONFIG_PROVENANCE: true

  publish-to-github-packages:
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-output

      - name: Setup Node.js for GitHub Packages
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com

      - name: Publish to GitHub Packages
        run: npm publish --tag latest
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Reuses the same validate job CI runs on every PR: builds the image,
  # boots it, smoke-tests MCP against mainnet, and gates on a Trivy
  # CRITICAL/HIGH scan (fixed only). Prevents tag releases from skipping
  # the gate that PRs already pass.
  image-validate:
    needs: [build]
    uses: ./.github/workflows/image-validate.yml
    permissions:
      contents: read

  # Build the multi-arch image once and push it to the dev registries
  # (dev ECR + GHCR). Gated on `image-validate` so a tag that fails npm
  # version (non-semver) or trivy does not produce a Docker release.
  publish-image-dev:
    needs: [build, image-validate]
    uses: ./.github/workflows/publish-image.yml
    with:
      image_tag: ${{ github.ref_name }}
      set_latest: true
      environment: dev
    secrets: inherit

  # Promote the exact manifest published to GHCR by `publish-image-dev`
  # into the prod ECR. No rebuild: `docker buildx imagetools create`
  # copies by digest, so dev and prod always end up running the same
  # image content under the same tag. Only the immutable `:<tag>` is
  # written to prod ECR; `:latest` is not mutated on prod.
  copy-image-to-prod:
    needs: [publish-image-dev]
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: read
      id-token: write
      packages: read
    env:
      ECR_REPOSITORY: mcp-server
      IMAGE_TAG: ${{ github.ref_name }}
    steps:
      - name: Configure AWS credentials (prod)
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to prod ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2.1.6

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Copy multi-arch manifest GHCR -> prod ECR
        run: |
          set -euo pipefail
          SRC="ghcr.io/${{ github.repository }}:${IMAGE_TAG}"
          DST="${{ steps.ecr.outputs.registry }}/${ECR_REPOSITORY}:${IMAGE_TAG}"
          docker buildx imagetools create --tag "$DST" "$SRC"
          echo "Promoted $SRC -> $DST"

  # Roll out the just-published image to the dev environment. No approval
  # gate; the `dev` GitHub environment has no protection rules.
  deploy-dev:
    needs: [publish-image-dev]
    uses: ./.github/workflows/deploy.yml
    with:
      image_tag: ${{ github.ref_name }}
      environment: dev
    secrets: inherit

  # Roll out to prod only after dev has succeeded, the prod image is
  # available, both package publications have completed successfully, AND a
  # reviewer approves. The approval gate is enforced by the `prod` GitHub
  # environment's protection rules (required_reviewers), not by the workflow.
  deploy-prod:
    needs: [deploy-dev, copy-image-to-prod, publish-to-npmjs, publish-to-github-packages]
    uses: ./.github/workflows/deploy.yml
    with:
      image_tag: ${{ github.ref_name }}
      environment: prod
    secrets: inherit
