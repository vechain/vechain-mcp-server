name: Validate Docker image

# Builds the runtime image locally (amd64), boots it, runs MCP smoke + integration
# checks against mainnet, and gates the result on a Trivy vulnerability scan
# (CRITICAL/HIGH, fixed only). Reused by CI (on every PR) and by the publish
# pipeline (on push to main) so the gate runs at both points.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build image for local test (amd64, load into Docker)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: vechain-mcp-server:ci-test
          no-cache: true

      - name: Generate ephemeral MCP API key
        id: api-key
        run: |
          set -euo pipefail
          KEY=$(openssl rand -hex 32)
          echo "::add-mask::$KEY"
          echo "key=$KEY" >> "$GITHUB_OUTPUT"

      - name: Run container (background) for integration test
        env:
          MCP_API_KEY: ${{ steps.api-key.outputs.key }}
        run: |
          docker run -d --rm \
            -p 4000:4000 \
            -e VECHAIN_NETWORK=mainnet \
            -e PORT=4000 \
            -e MCP_API_KEY \
            --name vechain-mcp-ci \
            vechain-mcp-server:ci-test

      - name: Wait for readiness (/ready)
        shell: bash
        run: |
          set -e
          for i in {1..60}; do
            if curl -fsS http://localhost:4000/ready >/dev/null; then
              echo "Ready OK"
              exit 0
            fi
            echo "Waiting for server... ($i)"
            sleep 2
          done
          echo "Server failed to become ready in time"
          docker logs vechain-mcp-ci || true
          exit 1

      - name: Wait for MCP readiness (tools/list)
        shell: bash
        env:
          MCP_API_KEY: ${{ steps.api-key.outputs.key }}
        run: |
          set -e
          LAST_RESPONSE=""
          for i in {1..60}; do
            LAST_RESPONSE=$(curl -sS -m 10 -X POST http://localhost:4000/mcp \
              -H "Authorization: Bearer ${MCP_API_KEY}" \
              -H 'Content-Type: application/json' \
              -H 'Accept: application/json, text/event-stream' \
              -d '{"jsonrpc":"2.0","id":"1","method":"tools/list"}' || true)
            if echo "$LAST_RESPONSE" | jq -e '.result.tools | any(.name == "thorGetBlock")' >/dev/null 2>&1; then
              echo "MCP tools ready"
              exit 0
            fi
            echo "Waiting for MCP tools... ($i)"
            sleep 2
          done
          echo "MCP tools not ready in time"
          echo "--- last response (first 1KB) ---"
          echo "$LAST_RESPONSE" | head -c 1024
          echo
          echo "--- container logs (last 100 lines) ---"
          docker logs --tail 100 vechain-mcp-ci || true
          exit 1

      - name: Integration check - thorGetBlock 1000
        shell: bash
        env:
          MCP_API_KEY: ${{ steps.api-key.outputs.key }}
        run: |
          set -euo pipefail
          RESPONSE=$(curl -s --max-time 60 -X POST http://localhost:4000/mcp \
            -H "Authorization: Bearer ${MCP_API_KEY}" \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            -d '{
              "jsonrpc":"2.0",
              "id":"1",
              "method":"tools/call",
              "params":{"name":"thorGetBlock","arguments":{"blockRevision":"1000"}}
            }')
          echo "$RESPONSE" | jq .
          echo "$RESPONSE" | jq -e '.result.structuredContent.ok == true'
          echo "$RESPONSE" | jq -e '.result.structuredContent.network == "mainnet"'
          echo "$RESPONSE" | jq -e '.result.structuredContent.data.number == 1000'
          echo "$RESPONSE" | jq -e '.result.structuredContent.data.id == "0x000003e80b3aca03fe03a742d0cd07b1260b42923c56b1032028e348d4da3188"'

      - name: Run vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: vechain-mcp-server:ci-test
          format: 'table'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
          vuln-type: 'os,library'
          scanners: 'misconfig,vuln,secret'
          exit-code: '1'
        env:
          TRIVY_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-db:2

      - name: Stop test container
        if: always()
        run: docker stop vechain-mcp-ci || true
